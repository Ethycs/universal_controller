# litellm proxy config for the uc/grok browser-driven backend.
#
# Run:
#   pixi run -e dev litellm --config litellm.config.yaml --port 4000
#
# WARNING: keep --num_workers at 1. The handler holds a single GrokClient
# whose Chrome profile is single-writer; running multiple proxy workers
# would launch competing browser processes against the same on-disk
# profile and corrupt it.
#
# Once the proxy is up, any OpenAI-shaped client works:
#
#   from openai import OpenAI
#   client = OpenAI(api_key="anything", base_url="http://localhost:4000/v1")
#   resp = client.chat.completions.create(
#       model="uc-grok",
#       messages=[{"role": "user", "content": "Reply in one word: hi"}],
#       # Continue the same Grok chat across calls:
#       extra_body={"session_id": "demo-1"},
#   )
#   print(resp.choices[0].message.content)
#   print(resp.model_extra.get("hidden_params", {}))  # has uc_conversation_url
#
# Blind / fire-and-forget (~1.6 s, returns empty content):
#   client.chat.completions.create(
#       model="uc-grok",
#       messages=[...],
#       extra_body={"session_id": "demo-1", "wait_for_response": false},
#   )

model_list:
  # Public name = "uc-grok". Internally routed to "uc/grok" which our
  # CustomLLM resolves to the GrokClient singleton.
  - model_name: uc-grok
    litellm_params:
      model: uc/grok
      # Cap how long we'll wait for a single response. Browser-driven
      # generation is slower than API LLMs, so set this generously.
      timeout: 180

  # Convenience alias preserving the OpenAI naming convention.
  - model_name: grok-browser
    litellm_params:
      model: uc/grok
      timeout: 180

  # Generic-engine sites (no hand-tuned adapter — routed through
  # uc_browser.sites.generic via UCBrowser.chat()). Only sites that pass
  # the bench's input pipeline are listed. Availability-gated: calls fail
  # fast with ServiceUnavailable when the health monitor says down.
  - model_name: uc-chatgpt
    litellm_params: { model: uc/chatgpt, timeout: 180 }
  - model_name: uc-perplexity
    litellm_params: { model: uc/perplexity, timeout: 180 }
  - model_name: uc-pi
    litellm_params: { model: uc/pi, timeout: 180 }
  - model_name: uc-lmarena
    litellm_params: { model: uc/lmarena, timeout: 180 }
  # grok.com via the generic engine (adapter bypassed) — generalization
  # verification model; production grok traffic should use uc-grok.
  - model_name: uc-grok-generic
    litellm_params: { model: uc/grok-generic, timeout: 180 }

  # AUTO-BOOTSTRAP: any chat-kind registry site is also callable as
  # uc/<name> without an entry here (UC_AUTO_BOOTSTRAP=0 disables).
  # Widget-kind sites never bootstrap — their chats reach human staff.
  #
  # CONVENTIONAL-API BACKUP: set UC_BACKUP_MODEL (e.g. "gpt-4o-mini",
  # "xai/grok-3" — needs the matching API key in the env) and any uc/*
  # call whose site is down/blocked transparently falls back to it; the
  # response carries hidden params uc_backup_used / uc_backup_reason.
  # Per-site override: backup_model on the registry entry. Per-request
  # opt-out: extra_body={"no_backup": true}.

litellm_settings:
  # Wire the persistent GrokClient-backed handler into the provider map
  # at proxy startup. The dotted path points at the module-level singleton
  # in src/event_harvester/llm_providers/uc.py.
  custom_provider_map:
    # Routed through uc_provider_loader.py (next to this config) because
    # the proxy resolves dotted paths as files relative to the config
    # directory, not as importable Python packages.
    - provider: uc
      custom_handler: uc_provider_loader.uc_handler

  # Drop OpenAI-specific params the proxy can't translate to our backend.
  drop_params: true

general_settings:
  # Browser automation is single-threaded by construction. Force a single
  # worker so we don't open competing browsers against the same profile.
  # (Pass `--num_workers 1` on the CLI as well — this is belt-and-braces.)
  worker_concurrency: 1

  # Live availability menu. Forwards to the UC status server (run it
  # alongside the proxy: `pixi run status-server`), so API clients can ask
  # the same base URL which uc/* models are currently up:
  #
  #   GET http://localhost:4000/uc/availability
  #
  # Returns {sites: [...], models_available: ["uc/grok", ...]}; each site
  # carries status/uptime/latency. The human uptime page is served by the
  # status server directly at http://127.0.0.1:4010/.
  pass_through_endpoints:
    - path: "/uc/availability"
      target: "http://127.0.0.1:4010/availability"
